name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    name: Run all tests before release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ vars.ARCALOT_GO_VERSION || '1.23' }}
      
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ vars.ARCALOT_PYTHON_VERSION || '3.12' }}
      
      - name: Install Poetry
        run: |
          python -m pip install --upgrade pip
          pip install poetry==1.8.3
      
      - name: Install Python dependencies
        working-directory: analysis
        run: poetry install --no-root
      
      - name: Run all tests
        run: ./scripts/test-all.sh
  
  release-go-server-binaries:
    name: Release Go MCP Server (binaries)
    needs: [tests]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write  # For cosign signing
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Required for changelog generation
      
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ vars.ARCALOT_GO_VERSION || '1.23' }}
      
      - name: Set up QEMU for multi-arch builds
        uses: docker/setup-qemu-action@v3
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Login to Quay.io
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}
      
      - name: Install cosign for signing
        if: startsWith(github.ref, 'refs/tags/')
        uses: sigstore/cosign-installer@v3
      
      - name: Install syft for SBOM generation
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin
      
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOPROXY: direct
          GOSUMDB: off
      
      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: go-server-release
          path: dist/
          retention-days: 7
  
  release-containers:
    name: Release containers (server + analysis)
    needs: [tests]
    uses: ./.github/workflows/container-build.yml
    permissions:
      contents: read
      packages: write
    with:
      # Extract version from tag (v1.0.0 -> 1.0.0)
      tag_override: ${{ github.ref_name }}
      push_images: true
    secrets: inherit
  
