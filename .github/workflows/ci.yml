name: ci

on:
  push:
    branches: [main, initial-development]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
      - name: Install golangci-lint
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh \
            | sh -s -- -b "$(go env GOPATH)"/bin v1.64.5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Poetry
        run: |
          python -m pip install --upgrade pip
          pip install poetry==1.8.3
      - name: Install Python dependencies
        run: |
          cd analysis
          poetry install --no-root
      - name: Run lint
        run: ./scripts/lint.sh

  go-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
      - name: Run Go tests
        run: ./scripts/test-go.sh
      - name: Run Go coverage
        run: ./scripts/test-go-coverage.sh

  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Poetry
        run: |
          python -m pip install --upgrade pip
          pip install poetry==1.8.3
      - name: Install Python dependencies
        run: |
          cd analysis
          poetry install --no-root
      - name: Run Python tests
        run: ./scripts/test-python.sh
      - name: Run Python coverage
        run: ./scripts/test-python-coverage.sh
