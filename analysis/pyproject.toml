[tool.poetry]
name = "arcaflow-analysis"
version = "0.1.0-dev"
description = "Arcaflow MCP analysis engine"
authors = ["Arcalot <contact@arcalot.io>"]
readme = "README.md"
packages = [{ include = "arcaflow_analysis" }]

[tool.poetry.dependencies]
python = ">=3.12.0,<3.13"
pandas = "==2.3.3"
pyyaml = "==6.0.3"
grpcio = "==1.76.0"
grpcio-health-checking = "==1.76.0"
sqlalchemy = "==2.0.45"

[tool.poetry.group.dev.dependencies]
pytest = "==9.0.2"
black = "==26.3.1"
flake8 = "==7.1.2"
ruff = "==0.14.13"
grpcio-tools = "==1.76.0"
pytest-cov = "^7.0.0"

[tool.black]
line-length = 88

[tool.ruff]
line-length = 88

[build-system]
requires = ["poetry-core==1.8.3"]
build-backend = "poetry.core.masonry.api"
